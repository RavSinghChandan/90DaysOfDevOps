version: '3.8'

services:
  web:
    image: node:14
    working_dir: /app
    volumes:
      - ./app:/app
    command: "npm start"
    ports:
      - "3000:3000"
    depends_on:
      - db

  db:
    image: mongo:latest
    volumes:
      - db-data:/data/db
    ports:
      - "27017:27017"

volumes:
  db-data:
