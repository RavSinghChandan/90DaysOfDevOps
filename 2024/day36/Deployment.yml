apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: your-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
        - name: todo-container
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: todo-storage
              mountPath: /usr/share/nginx/html
      volumes:
        - name: todo-storage
          persistentVolumeClaim:
            claimName: todo-pvc
